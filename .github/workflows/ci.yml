---
name: Continuous-Integration
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
permissions:
  contents: read
  checks: read
jobs:
  ci-tasks:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ec-intl/workflow-templates/.github/workflows/ci_template.yml@e74c17cbfff7d93740da4298421f2442d0b80d87
    with:
      runner-name: ubuntu-24.04
      run-on-pull-request: true
  staging-package:
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    environment: staging
    env:
      EVENT: ${{ github.event_name }}
      BRANCH: ${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
      - name: Run tests in container
        run: docker compose --profile ci-testing up --build --exit-code-from ci-testing
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build and upload to Test PyPI
        if: ${{ vars.STAGE_TO_PYPI == 'yes' && contains(env.BRANCH, 'staging') && env.EVENT == 'merge_group' }}
        env:
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_KEY }}
        run: |
          echo "📦 Installing Python dependencies."
          python -m pip install --upgrade pip
          if [ -f requirements/staging.txt ]; then
            pip install -r requirements/staging.txt;
          fi
          
          echo "🧹 Cleaning old build artifacts."
          rm -rf build dist *.egg-info src/*.egg-info || true

          echo "🔍 Checking metadata source files."
          ls -l VERSION README.md
          cat VERSION

          echo "🛠️ Installing build tools."
          python -m pip install --upgrade build twine

          echo "🏗️ Building package."
          python -m build

          echo "✅ Checking distributions."
          python -m twine check dist/*

          echo "🚀 Uploading to Test PyPI."
          python -m twine upload --repository testpypi dist/*

      - name: Clean up containers
        if: always()
        run: docker compose --profile ci-testing down
